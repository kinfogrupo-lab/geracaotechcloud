<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar no sistema | Geração Tech</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Sora:wght@700&display=swap">
<style>:root{--bg:#070d16;--card:#101c2e;--line:#1e3048;--tx:#e8f0fa;--mut:#8fa4bd;--ac:#0ea5e9}*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 Manrope,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;width:100%;max-width:440px}
img{height:64px;display:block;margin:0 auto 14px}h1{font:700 24px Sora;text-align:center;margin-bottom:6px}p{color:var(--mut);text-align:center;margin-bottom:20px;font-size:15px}
label{font-weight:800;font-size:14px}.row{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:#0a1220;margin:8px 0 16px;overflow:hidden}
input{flex:1;min-width:0;background:none;border:0;color:var(--tx);font:600 16px Manrope;padding:13px 12px;outline:none}.row span{color:var(--mut);padding-right:12px;font-size:14px}
button,.b{display:block;width:100%;text-align:center;background:var(--ac);color:#04121e;border:0;border-radius:10px;padding:13px;font:800 15px Manrope;cursor:pointer;text-decoration:none}
.o{background:none;border:1px solid var(--line);color:var(--tx);margin-top:10px}.err{color:#f87171;font-size:14px;min-height:20px;margin:-6px 0 8px}small{display:block;text-align:center;color:var(--mut);margin-top:16px}a{color:#38bdf8}:focus-visible{outline:2px solid #38bdf8;outline-offset:2px}</style></head><body>
<main class="box"><img src="https://ginfotecn.com/logo.1779470608.png" alt="Geração Tech"><h1>Entrar no sistema</h1><p>Digite o endereço do seu ambiente, o mesmo que você recebeu por e-mail.</p>
<form id="f"><label for="s">Endereço do seu sistema</label><div class="row"><input id="s" autocomplete="off" autocapitalize="none" placeholder="minha-barbearia" required><span>.ginfotecn.com</span></div><div class="err" id="e" role="alert"></div><button type="submit">Entrar</button></form>
<a class="b o" href="https://ginfotecn.com/login">Meu sistema é ginfotecn.com</a>
<small>Ainda não tem? <a href="https://geracaotechcloud.com.br/teste.html">Teste grátis por 5 dias</a></small></main>
<script>document.getElementById('f').onsubmit=function(ev){ev.preventDefault();var v=document.getElementById('s').value.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/\.ginfotecn\.com.*$/,'').replace(/\/.*$/,'');
if(!/^[a-z0-9]([a-z0-9-]{0,60}[a-z0-9])?$/.test(v)){document.getElementById('e').textContent='Use só letras, números e hífen, como no e-mail de boas-vindas.';return}location.href='https://'+v+'.ginfotecn.com/login'}</script></body></html>
